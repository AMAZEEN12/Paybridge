# Render Blueprint: a web service (built from the Dockerfile) plus a free Postgres database.
# In Render: New > Blueprint > pick this repository. Render asks for the values marked sync: false.
# Free-tier facts (check Render's pricing page, they change): the web service sleeps after 15 minutes
# without traffic, and the free Postgres expires after 30 days.
databases:
  - name: paybridge-db
    plan: free
    databaseName: paybridge
    user: paybridge

services:
  - type: web
    name: paybridge
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: paybridge-db
          property: host
      - key: OXR_APP_ID
        sync: false
      - key: PAYBRIDGE_CONVERSION_ENABLED
        value: "true"
      - key: DB_PORT
        fromDatabase:
          name: paybridge-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: paybridge-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: paybridge-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: paybridge-db
          property: password
      - key: JWT_SECRET
        generateValue: true          # Render makes a long random value for you
      - key: PAYSTACK_SECRET_KEY
        sync: false                  # paste your Paystack TEST secret key in the Render dashboard (leave empty to use the fake gateway)
      # Without these two the app uses a FAKE gateway and nothing reaches Paystack (the logs say "GATEWAY: FAKE").
      # After the first successful deploy, add these in the dashboard:
      #   SPRING_PROFILES_ACTIVE = paystack
      #   PAYSTACK_PAYOUT_MODE   = live     (recipient + transfer + verify go to Paystack TEST; webhooks arrive)
      # Name lookups: leave PAYSTACK_RESOLVE_MODE unset to get a made-up name ("TEST ACCOUNT 1234") and spend no lookups,
      # or set PAYSTACK_RESOLVE_MODE = live for real names (Paystack test mode allows about 3 a day; the app counts them).
      # To switch off the "Add test money" button on a public deployment:
      #   PAYBRIDGE_DEV_FUNDING_ENABLED = false
      # Payouts abroad go through Flutterwave. Use the TEST secret key (FLWSECK_TEST-...) while testing.
      - key: PAYBRIDGE_PAYOUT_PROVIDER
        value: flutterwave
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false                  # same value as the secret hash in the Flutterwave dashboard
      # Optional, add in the dashboard when needed:
      #   FLUTTERWAVE_VERIFY_MODE = live                 (real account name lookups; default is auto)
      #   FLUTTERWAVE_SIMULATE_SUCCESS_AFTER = PT15S     (TEST key only: a pending payout turns successful after 15 seconds)
      # Settlement: setting the admin key switches the settlement endpoints on. Leave it empty to keep them off.
      - key: PAYBRIDGE_SETTLEMENT_ADMIN_KEY
        sync: false