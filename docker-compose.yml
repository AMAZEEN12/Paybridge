# OPTIONAL. Only if you want Postgres without installing it. You can keep using the Postgres on your laptop instead.
#   docker compose up -d
# then use DB_HOST=localhost DB_USER=postgres DB_PASSWORD=postgres
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: paybridge
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
