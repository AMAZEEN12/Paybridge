spring:
  application:
    name: paybridge
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paybridge_v3}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS:50}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{1} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

paybridge:
  # Required. At least 32 characters. Set JWT_SECRET in the environment; never commit a real value.
  jwt-secret: ${JWT_SECRET}
  jwt-ttl-minutes: 30
  # Development-only "add test money" endpoint. Set to false once real funding exists.
  dev-funding-enabled: ${PAYBRIDGE_DEV_FUNDING_ENABLED:true}
  scheduler:
    enabled: true
  reconciliation:
    enabled: ${PAYBRIDGE_RECONCILIATION_ENABLED:true}
    interval: ${PAYBRIDGE_RECONCILIATION_INTERVAL:PT1H}
    # Operators only. Leave empty to switch the endpoint off. Set a long random value in the environment; never commit it.
    admin-key: ${PAYBRIDGE_RECONCILIATION_ADMIN_KEY:}
  paystack:
    base-url: https://api.paystack.co
    secret-key: ${PAYSTACK_SECRET_KEY:}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    resolve-mode: ${PAYSTACK_RESOLVE_MODE:auto}
    payout-mode: ${PAYSTACK_PAYOUT_MODE:simulated}
    # Paystack gives a TEST account only a few live name lookups a day. We count them and remember names we have found.
    resolve-daily-limit: ${PAYSTACK_RESOLVE_DAILY_LIMIT:3}      # 0 = no counter (use with a live key)
    resolve-cache-hours: ${PAYSTACK_RESOLVE_CACHE_HOURS:24}
  currencies:
    # Sanctioned currencies, comma separated. They are unusable even if they are in the currencies table.
    # To be verified against current OFAC, UN and EU lists before release (spec R-CUR-4).
    excluded: ${PAYBRIDGE_CURRENCIES_EXCLUDED:IRR,KPW,SYP,CUP}
  geo:
    base-url: https://free.freeipapi.com/api/v1/json
    timeout-ms: 3000
    client-ip-header: ${PAYBRIDGE_GEO_CLIENT_IP_HEADER:True-Client-IP}
    allow-override: ${PAYBRIDGE_GEO_ALLOW_OVERRIDE:false}        # never set this on Render
    override-country: ${PAYBRIDGE_GEO_OVERRIDE_COUNTRY:}        # tests and local development only
  fx:
    provider: ${PAYBRIDGE_FX_PROVIDER:stub}      # stub or openexchangerates. Tests and local runs stay on stub.
    base-url: https://openexchangerates.org/api
    app-id: ${OXR_APP_ID:}
    timeout-ms: 5000
    refresh-interval: PT1H
    check-interval: PT10M
    max-snapshot-age: PT3H
    on-demand-refresh-min-gap: PT10M
    quota-stop-percent: 95
  charges:
    vat-rate: 0.075
    stamp-duty-kobo: 5000
    stamp-duty-threshold-kobo: 1000000      # N10,000
    fee-bands:                              # CBN 2026 circular; confirm with your lead
      - up-to-kobo: 500000                  # up to N5,000
        fee-kobo: 0
      - up-to-kobo: 5000000                 # up to N50,000
        fee-kobo: 1000
      - fee-kobo: 5000                      # above that
    # CBN 2020 guide instead: first band fee-kobo 1000, second band fee-kobo 2500
  fraud:
    max-single-transfer-kobo: 100000000     # N1,000,000
    max-daily-outgoing-kobo: 500000000      # N5,000,000
    velocity-max-transfers: 5
    velocity-window-minutes: 10
    new-beneficiary-flag-kobo: 20000000     # N200,000
    pass-through-window-minutes: 30
    pass-through-ratio: 0.8
    pin-max-attempts: 3
    pin-lock-minutes: 30
  login:
    max-failed-attempts: 5
    lock-minutes: 15
  resolve-limit-per-minute: 10
  zone: Africa/Lagos
  conversion:
    enabled: ${PAYBRIDGE_CONVERSION_ENABLED:false}
  quotes:
    conversion-ttl: PT60S
    transfer-ttl: PT30M
    max-active-per-customer: 5
    stuck-executing-limit: PT5M
  fee:
    rate: 0.005
    free-days: 30
  limits:
    conversion-max-usd: 1000
    daily-max-usd: 5000
    velocity-max-conversions: 5
    velocity-window-minutes: 10